[workspace]
resolver = "2"
members = [
    "crates/models",
    "crates/events",
    "crates/adapters",
    "crates/utils",
    "crates/filesystem",
    "crates/config",
    "crates/scanner",
    "crates/file-diff",
    "crates/cache",
    "crates/storage",
    "crates/watcher",
    "crates/runtime",
    "crates/api",
    "cli",
    "app",
    "crates",
]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.42.0", features = ["full"] }

# Web framework
axum = "0.7.9"
tower = { version = "0.5.2", features = ["limit"] }
tower-http = { version = "0.6.2", features = ["compression-full", "cors", "limit", "timeout"] }

# Serialization
serde = { version = "1.0.217", features = ["derive"] }
toml = "0.8.19"
toml_edit = "0.22.22"
bytes = "1.9.0"

# Date/Time
chrono = { version = "0.4.39", features = ["serde"] }

# Caching & Concurrency
moka = { version = "0.12.8", features = ["future"] }
dashmap = "6.1.0"
parking_lot = "0.12.3"
rayon = "1.10.0"
futures = "0.3"

# File operations
walkdir = "2.5.0"
notify = "7.0.0"

# Hashing
sha1 = "0.10.6"
hex = "0.4.3"

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
colored = "2.2.0"

# Error handling
thiserror = "2.0"

# Dev dependencies (tests)
tempfile = "3.14.0"
wiremock = "0.6.2"
pretty_assertions = "1.4.1"
