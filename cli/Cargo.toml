[package]
name = "lighty-cli"
version = "2026.2.1"
edition = "2021"

[features]
default = []
s3 = ["lighty-runtime/s3"]

[[bin]]
name = "lighty"
path = "src/main.rs"

[dependencies]
# Internal crates
lighty-runtime = { path = "../crates/runtime" }
lighty-config = { path = "../crates/config" }

# Async runtime
tokio = { workspace = true }

# CLI framework
clap = { version = "4.5", features = ["derive", "cargo"] }

# Serialization
serde = { workspace = true }
serde_json = "1.0"
toml = { workspace = true }

# Date/Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Process management
sysinfo = "0.32"

# Error handling
thiserror = { workspace = true }

# Cross-platform paths
dirs = "5.0"

# Colored output
colored = { workspace = true }
