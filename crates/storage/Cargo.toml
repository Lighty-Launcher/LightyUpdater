[package]
name = "lighty-storage"
description = "Storage backend abstraction (local / S3 / R2) for LightyUpdater"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = []
s3 = ["aws-sdk-s3", "aws-config", "aws-credential-types"]

[dependencies]
lighty-config = { workspace = true }
tokio     = { workspace = true }
bytes     = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }
async-trait = "0.1"

aws-sdk-s3           = { version = "1.15", optional = true }
aws-config           = { version = "1.1",  optional = true }
aws-credential-types = { version = "1.1",  optional = true }
